name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_build_all:
        description: 'Force build all microservices (One-time baseline override)'
        type: boolean
        default: false

jobs:
  # -------------------------------------------------------------
  # 1. CHANGE DETECTION: Determine which microservices changed
  # -------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend-services: ${{ steps.backend_matrix.outputs.backend-services }}
      frontend-changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed file paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/shared/**'
              - 'Dockerfile.service'
              - 'package.json'
              - 'package-lock.json'
            frontend:
              - 'frontend/**'
            auth-service: 'backend/auth-service/**'
            quiz-service: 'backend/quiz-service/**'
            media-service: 'backend/media-service/**'
            ai-service: 'backend/ai-service/**'
            gateway: 'backend/gateway/**'
            classroom-service: 'backend/classroom-service/**'
            achievement-service: 'backend/achievement-service/**'
            question-bank-service: 'backend/question-bank-service/**'
            content-service: 'backend/content-service/**'
            topic-service: 'backend/topic-service/**'
            assignment-service: 'backend/assignment-service/**'
            org-service: 'backend/org-service/**'
            notification-service: 'backend/notification-service/**'
            story-service: 'backend/story-service/**'

      - name: Compute Backend Services Matrix
        id: backend_matrix
        run: |
          CHANGES='${{ steps.filter.outputs.changes }}'
          echo "Raw changes: $CHANGES"
          
          # Filter out non-backend-service keys ('frontend', 'backend')
          CLEANED=$(echo "$CHANGES" | jq -c '[.[] | select(. != "frontend" and . != "backend")]')
          
          # If shared backend code or build configs changed, build all backend services
          BACKEND_SHARED='${{ steps.filter.outputs.backend }}'
          if [ "$BACKEND_SHARED" = "true" ] && [ "$CLEANED" = "[]" ]; then
            CLEANED='["auth-service","quiz-service","media-service","ai-service","gateway","classroom-service","achievement-service","question-bank-service","content-service","topic-service","assignment-service","org-service","notification-service","story-service"]'
          fi
          
          echo "Computed backend services: $CLEANED"
          echo "backend-services=$CLEANED" >> $GITHUB_OUTPUT

  # -------------------------------------------------------------
  # 2. BUILD & PUSH BACKEND (Runs changed services OR all services if forced)
  # -------------------------------------------------------------
  build-and-push-backend:
    needs: detect-changes
    if: ${{ (needs.detect-changes.outputs.backend-services != '[]' && needs.detect-changes.outputs.backend-services != '') || inputs.force_build_all == true }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ inputs.force_build_all == true && fromJson('["auth-service","quiz-service","media-service","ai-service","gateway","classroom-service","achievement-service","question-bank-service","content-service","topic-service","assignment-service","org-service","notification-service","story-service"]') || fromJson(needs.detect-changes.outputs.backend-services) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: harishdell/els-ai-${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push backend service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.service
          platforms: linux/amd64
          build-args: |
            SERVICE_WORKSPACE=backend/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # 3. RUN FRONTEND UNIT TESTS (Runs if frontend changed OR forced)
  # -------------------------------------------------------------
  test-frontend:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend-changed == 'true' || inputs.force_build_all == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run unit tests
        run: |
          cd frontend
          npm test

  # -------------------------------------------------------------
  # 4. BUILD & PUSH FRONTEND (Runs if tests pass)
  # -------------------------------------------------------------
  build-and-push-frontend:
    needs: [detect-changes, test-frontend]
    if: ${{ needs.detect-changes.outputs.frontend-changed == 'true' || inputs.force_build_all == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: harishdell/els-ai-frontend
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          build-args: |
            EXPO_PUBLIC_API_BASE_URL=https://emeelan.in/els-ai/api
            EXPO_PUBLIC_TTS_URL=https://emeelan.in/els-ai/tts
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # 4. GITOPS UPDATE STEP: Updates manifests in config repository
  # -------------------------------------------------------------
  update-gitops-manifests:
    needs: [detect-changes, build-and-push-backend, build-and-push-frontend]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: 'hcmuleva/els-ai'
          token: ${{ secrets.CONFIG_REPO_PAT }}
          path: 'config-repo'

      - name: Update Image Tags for Built Services Only
        run: |
          cd config-repo/k8s-config-repo
          
          # Extract first 7 chars of commit SHA and add 'sha-' prefix (e.g. sha-9f9ed58)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          COMMIT_TAG="sha-${SHORT_SHA}"
          
          # Parse inputs and changed outputs
          CHANGED_BACKEND='${{ needs.detect-changes.outputs.backend-services }}'
          FORCE_ALL='${{ inputs.force_build_all }}'
          
          # Helper function to update a specific service YAML file
          update_service_tag() {
            SERVICE_NAME=$1
            YAML_FILE="${SERVICE_NAME}.yaml"
            if [ -f "$YAML_FILE" ]; then
              echo "Updating tag for $SERVICE_NAME to $COMMIT_TAG"
              sed -i "s|image: harishdell/els-ai-${SERVICE_NAME}:.*|image: harishdell/els-ai-${SERVICE_NAME}:${COMMIT_TAG}|g" "$YAML_FILE"
            fi
          }

          # Update backend services that were built
          if [ "$FORCE_ALL" = "true" ]; then
            for f in *.yaml; do
              sed -i "s|image: harishdell/els-ai-\([^:]*\):.*|image: harishdell/els-ai-\1:${COMMIT_TAG}|g" "$f"
            done
          elif [ "$CHANGED_BACKEND" != "[]" ] && [ -n "$CHANGED_BACKEND" ]; then
            for service in $(echo "$CHANGED_BACKEND" | jq -r '.[]'); do
              update_service_tag "$service"
            done
          fi

          # Update frontend if it changed
          FRONTEND_CHANGED='${{ needs.detect-changes.outputs.frontend-changed }}'
          if [ "$FRONTEND_CHANGED" = "true" ] || [ "$FORCE_ALL" = "true" ]; then
            update_service_tag "frontend"
          fi

          # Configure Git credentials
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit and push changes if updates occurred
          if ! git diff --quiet; then
            git add .
            git commit -m "chore(deploy): update image tags to ${COMMIT_TAG}"
            git push
          else
            echo "No image tags needed updating."
          fi