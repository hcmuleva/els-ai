name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - quiz-service
          - media-service
          - ai-service
          - gateway
          - classroom-service
          - achievement-service
          - question-bank-service
          - content-service
          - topic-service
          - assignment-service
          - org-service
          - notification-service
          - story-service
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: harishdell/els-ai-${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
            type=raw,value=2.1

      - name: Build and push backend service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.service
          build-args: |
            SERVICE_WORKSPACE=backend/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: harishdell/els-ai-frontend
          tags: |
            type=sha,format=long
            type=raw,value=latest
            type=raw,value=2.1

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          build-args: |
            EXPO_PUBLIC_API_BASE_URL=https://emeelan.in/els-ai/api
            EXPO_PUBLIC_TTS_URL=https://emeelan.in/els-ai/tts
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # NEW GITOPS STEP: Runs only after all images build successfully
  # -------------------------------------------------------------
  update-gitops-manifests:
    needs: [build-and-push-backend, build-and-push-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Config Repository
        uses: actions/checkout@v4
        with:
          repository: 'hcmuleva/k8s-config-repo' # Replace with your config repo
          token: ${{ secrets.CONFIG_REPO_PAT }} # GitHub PAT with write access to config repo
          path: 'config-repo'

      - name: Update Image Tags in Config Repository
        run: |
          cd config-repo
          
          # Compute the commit SHA tag used during build
          COMMIT_TAG="${{ github.sha }}"
          
          # Find all deployment YAMLs and update harishdell images to the new SHA tag
          # Works across all your 14 microservice manifests and frontend deployment
          find base/ -type f -name "*.yaml" -exec sed -i "s|image: harishdell/els-ai-\([^:]*\):.*|image: harishdell/els-ai-\1:${COMMIT_TAG}|g" {} +
          
          # Commit and push changes back to GitOps repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only commit if changes exist
          if ! git diff --quiet; then
            git add base/
            git commit -m "chore(deploy): update image tags to commit ${{ github.sha }}"
            git push
          else
            echo "No image tags needed updating."
          fi