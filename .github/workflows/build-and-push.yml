name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_build_all:
        description: 'Force build all microservices (One-time baseline override)'
        type: boolean
        default: true

jobs:
  # -------------------------------------------------------------
  # 1. CHANGE DETECTION: Determine which microservices changed
  # -------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend-services: ${{ steps.filter.outputs.changes }}
      frontend-changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed file paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth-service: 'backend/auth-service/**'
            quiz-service: 'backend/quiz-service/**'
            media-service: 'backend/media-service/**'
            ai-service: 'backend/ai-service/**'
            gateway: 'backend/gateway/**'
            classroom-service: 'backend/classroom-service/**'
            achievement-service: 'backend/achievement-service/**'
            question-bank-service: 'backend/question-bank-service/**'
            content-service: 'backend/content-service/**'
            topic-service: 'backend/topic-service/**'
            assignment-service: 'backend/assignment-service/**'
            org-service: 'backend/org-service/**'
            notification-service: 'backend/notification-service/**'
            story-service: 'backend/story-service/**'
            frontend: 'frontend/**'

  # -------------------------------------------------------------
  # 2. BUILD & PUSH BACKEND (Runs changed services OR all services if forced)
  # -------------------------------------------------------------
  build-and-push-backend:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend-services != '[]' || inputs.force_build_all == true }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ inputs.force_build_all == true && fromJson('["auth-service","quiz-service","media-service","ai-service","gateway","classroom-service","achievement-service","question-bank-service","content-service","topic-service","assignment-service","org-service","notification-service","story-service"]') || fromJson(needs.detect-changes.outputs.backend-services) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: harishdell/els-ai-${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push backend service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.service
          build-args: |
            SERVICE_WORKSPACE=backend/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # 3. BUILD & PUSH FRONTEND (Runs if frontend changed OR forced)
  # -------------------------------------------------------------
  build-and-push-frontend:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend-changed == 'true' || inputs.force_build_all == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: harishdell/els-ai-frontend
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          build-args: |
            EXPO_PUBLIC_API_BASE_URL=https://emeelan.in/els-ai/api
            EXPO_PUBLIC_TTS_URL=https://emeelan.in/els-ai/tts
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # 4. GITOPS UPDATE STEP: Updates manifests in config repository
  # -------------------------------------------------------------
  update-gitops-manifests:
    needs: [detect-changes, build-and-push-backend, build-and-push-frontend]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Config Repository
        uses: actions/checkout@v4
        with:
          repository: 'hcmuleva/k8s-config-repo'
          token: ${{ secrets.CONFIG_REPO_PAT }}
          path: 'config-repo'

      - name: Update Image Tags in Config Repository
        run: |
          cd config-repo
          
          # Get current Git Commit SHA
          COMMIT_TAG="${{ github.sha }}"
          
          # Replace all harishdell image tags dynamically with the Git SHA tag
          find base/ -type f -name "*.yaml" -exec sed -i "s|image: harishdell/els-ai-\([^:]*\):.*|image: harishdell/els-ai-\1:${COMMIT_TAG}|g" {} +
          
          # Configure Git credentials
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Commit and push changes if updates occurred
          if ! git diff --quiet; then
            git add base/
            git commit -m "chore(deploy): update image tags to commit ${{ github.sha }}"
            git push
          else
            echo "No image tags needed updating."
          fi