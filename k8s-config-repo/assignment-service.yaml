apiVersion: apps/v1
kind: Deployment
metadata:
  name: assignment-service
  namespace: els-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assignment-service
  template:
    metadata:
      labels:
        app: assignment-service
    spec:
      containers:
        - name: assignment-service
          image: harishdell/els-ai-assignment-service:6ff77a0b90972e33082f72499a22d11bf151932c
          imagePullPolicy: Always
          ports:
            - containerPort: 4011
          env:
            - name: PORT
              value: "4011"
          envFrom:
            - configMapRef:
                name: els-ai-config
            - secretRef:
                name: els-ai-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 4011
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4011
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: assignment-service
  namespace: els-ai
spec:
  selector:
    app: assignment-service
  ports:
    - name: http
      port: 4011
      targetPort: 4011
