apiVersion: apps/v1
kind: Deployment
metadata:
  name: classroom-service
  namespace: els-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: classroom-service
  template:
    metadata:
      labels:
        app: classroom-service
    spec:
      containers:
        - name: classroom-service
          image: harishdell/els-ai-classroom-service:bce4262bef1c32124b42f7e3bc1c6fb9a2d3e5f6
          imagePullPolicy: Always
          ports:
            - containerPort: 4006
          env:
            - name: PORT
              value: "4006"
          envFrom:
            - configMapRef:
                name: els-ai-config
            - secretRef:
                name: els-ai-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 4006
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4006
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: classroom-service
  namespace: els-ai
spec:
  selector:
    app: classroom-service
  ports:
    - name: http
      port: 4006
      targetPort: 4006
