apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: els-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: harishdell/els-ai-frontend:fed77b01c94a3f2c3ff536e60bb19bfa70e14406
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: els-ai
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
